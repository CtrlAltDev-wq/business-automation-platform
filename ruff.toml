line-length = 100
target-version = "py310"

# Alembic writes these files itself; reformatting them would make every
# autogenerated migration differ from the template output.
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B"]
# FastAPI dependency injection is a function call in a default argument by design.
ignore = ["B008"]

[lint.isort]
# Keep `from fastapi import status as http_status` in the same block as the other names.
combine-as-imports = true
# The local "alembic" directory otherwise makes ruff treat the package as first-party.
known-third-party = ["alembic"]
