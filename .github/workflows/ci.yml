name: CI

# Title shown in the Actions list. Without run-name GitHub falls back to the
# first line of the triggering commit message, which reads poorly when commits
# have short messages. head_ref is set for pull requests, ref_name otherwise.
run-name: CI · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Ruff + pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Verify migrations
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        run: pytest -q
